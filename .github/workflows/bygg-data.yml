# Genererer app/data.json fra Excel-filen hver gang kilden endres.
# Da holder det å lime inn raden i regnearket og committe det.

name: Bygg data.json

on:
  push:
    paths:
      - 'app/*.xlsx'
      - 'app/excel_til_json.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: pip install pandas openpyxl

      - name: Konverter Excel til JSON
        run: python3 app/excel_til_json.py app/KI_register_v3.xlsx app/data.json

      - name: Commit hvis noe er endret
        run: |
          if git diff --quiet -- app/data.json; then
            echo "data.json er uendret."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data.json
          git commit -m "Regenerert data.json fra registeret"
          git push
